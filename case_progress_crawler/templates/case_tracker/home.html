{% extends "case_tracker/base.html" %}
{% block top %}
{% include "case_tracker/_search.html" %}
{% endblock %}
{% block body %}
<form method="get" style="margin:1rem 0">
  {% if q %}<input type="hidden" name="q" value="{{ q }}">{% endif %}
  <label>Year
    <select name="year" onchange="this.form.submit()">
      <option value="">All</option>
      {% for y in years %}<option value="{{ y }}" {{ 'selected' if y == year }}>{{ y }}</option>{% endfor %}
    </select>
  </label>
  <noscript><button>Filter</button></noscript>
  <span class="muted">{{ cases|length }} cases</span>
  · <a href="{{ url_for('case_tracker.hearings', year=year) }}">Hearings by date</a>
  · <a href="{{ url_for('case_tracker.hospitals') }}">Hospitals</a>
  · <a href="{{ url_for('case_tracker.advocates') }}">Advocates</a>
</form>
{% include "case_tracker/_cases_table.html" %}

{% endblock %}
