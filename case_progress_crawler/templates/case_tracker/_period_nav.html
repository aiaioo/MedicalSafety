<p class="muted periods">Cases filed: {% for k, label in periods %}{% if k == period %}<strong>{{ label }}</strong>{% else %}<a href="{{ period_url(k) }}">{{ label }}</a>{% endif %}{{ ' &middot; '|safe if not loop.last }}{% endfor %}</p>
<script>
  // Choosing a period replaces just the analytics (the element with id "analytics"), not the whole page.
  if (!window.periodAjax) {
    window.periodAjax = true;
    document.addEventListener('click', async e => {
      const a = e.target.closest && e.target.closest('p.periods a');
      const box = document.getElementById('analytics');
      if (!a || !box || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault();
      box.style.opacity = .5;
      try {
        const r = await fetch(a.href);
        if (!r.ok) throw new Error(r.status);
        const fresh = new DOMParser().parseFromString(await r.text(), 'text/html').getElementById('analytics');
        if (!fresh) throw new Error('no analytics in the reply');
        box.replaceWith(fresh);
        history.replaceState(null, '', a.href);
      } catch (err) { location.href = a.href; }
    });
  }
</script>
