{% extends "base.html" %}
{% block body %}
<form method="get" style="margin:1rem 0">
  <input type="search" name="q" value="{{ q }}" list="suggestions" autocomplete="off" size="40"
         placeholder="Search party, case number or hospital" aria-label="Search cases">
  <datalist id="suggestions"></datalist>
  <button type="submit">Search</button>
  <label>Year
    <select name="year" onchange="this.form.submit()">
      <option value="">All</option>
      {% for y in years %}<option value="{{ y }}" {{ 'selected' if y == year }}>{{ y }}</option>{% endfor %}
    </select>
  </label>
  <noscript><button>Filter</button></noscript>
  <span class="muted">{{ cases|length }} cases</span>
  · <a href="{{ url_for('hearings', year=year) }}">Hearings by date</a>
  · <a href="{{ url_for('hospitals') }}">Hospitals</a>
</form>
{% include "_cases_table.html" %}
<script>
  const box = document.querySelector('input[name=q]'), list = document.getElementById('suggestions');
  let timer;
  box.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const r = await fetch('{{ url_for("suggest") }}?q=' + encodeURIComponent(box.value));
      list.replaceChildren(...(await r.json()).map(s => Object.assign(document.createElement('option'), {value: s})));
    }, 150);
  });
</script>
{% endblock %}
