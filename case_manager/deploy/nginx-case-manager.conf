server {
    if ($host = www.medicalsafety.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = medicalsafety.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.caseplan.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = caseplan.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name caseplan.in www.caseplan.in medicalsafety.in www.medicalsafety.in;
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;








}
server {
    server_name caseplan.in www.caseplan.in medicalsafety.in www.medicalsafety.in;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/caseplan.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/caseplan.in/privkey.pem; # managed by Certbot
    client_max_body_size 200m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # Pass upload bodies straight through instead of spooling them to /var/lib/nginx/body first
        # (that spool would hold unencrypted patient documents on disk); the app encrypts as it reads.
        proxy_request_buffering off;
        # Likewise for responses: never spool a big (decrypted) download to /var/lib/nginx/proxy on disk. Beyond
        # the in-memory buffers nginx just waits for the client, which the app's streaming handles.
        proxy_max_temp_file_size 0;
    }






}
