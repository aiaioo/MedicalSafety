{#- Title-bar notification bell (app.py's inject_notifications): links to the
    collaborations page, with a badge counting invitations received and
    accepted invitations not yet looked at. -#}
<a class="notify-bell" href="{{ url_for('collaborations_view') }}"
   title="{% if notification_count %}{{ notification_count }} collaboration notification{{ '' if notification_count == 1 else 's' }}{% else %}Collaborations{% endif %}"
   aria-label="Collaboration notifications{% if notification_count %}: {{ notification_count }} new{% endif %}">
  <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.2 1.5H2.8L4 11z"/><path d="M6.5 14a1.6 1.6 0 0 0 3 0"/></svg>
  {% if notification_count %}<span class="notify-badge">{{ notification_count }}</span>{% endif %}
</a>
