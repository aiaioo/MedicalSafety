<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — {{ site_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <form class="modal auth-card" method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <p class="auth-site-name">{{ site_name }}</p>
    <h3>Choose a new password</h3>
    <label class="modal-field">New password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
    </label>
    <label class="modal-field">Confirm new password
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    {% if error %}<p class="error-message">{{ error }}</p>{% endif %}
    <div class="modal-actions">
      <button type="submit" class="btn">Change password</button>
    </div>
    {% include "_also_called.html" %}
  </form>
</div>
</body>
</html>
