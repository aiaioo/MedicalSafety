<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Causes</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body{% if g.user and g.user.is_guest %} data-guest="1"{% endif %}>
<div id="causesApp"
     data-can-create="{{ '1' if can_create else '' }}"
     data-causes-url="{{ url_for('api_causes') }}"
     data-cause-url-base="{{ url_for('api_cause', cause_id='__ID__') }}"
     data-default-cause="{{ default_cause_id }}"
     data-cases-url="{{ url_for('api_allegation_cases') }}"
     data-cases-page-url="{{ url_for('cases_view') }}"
>
  <header class="docbar" style="position: relative;">
    <a class="home-link docbar-lead" href="{{ url_for('index') }}" title="Home"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5 8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/><path d="M6.5 14v-4h3v4"/></svg></a>
    <div class="docbar-center"><span class="doc-name doc-name-static">Causes</span>{% include "_cause_picker.html" %}</div>
    <span id="saveStatus" class="save-status"></span>
    {% if g.user and not g.user.is_guest %}<a class="btn" style="margin-left: auto;" href="{{ url_for('activities_view') }}">Activities</a>{% endif %}
    <a class="btn" {% if not (g.user and not g.user.is_guest) %}style="margin-left: auto;" {% endif %}href="{{ url_for('cases_view') }}">Cases</a>
  </header>

  <main class="allegations-layout">
    <div class="allegations-workspace" id="causesWorkspace">
      <aside class="allegations-column causes-column">
        <div class="allegations-column-head">
          <h2>Causes</h2>
          <button type="button" class="btn" id="addCauseBtn" {{ 'disabled' if not can_create }}>+ New cause</button>
        </div>
        <p class="empty" id="causeListEmpty" style="display:none">No causes yet. Add one to get started.</p>
        <div class="allegation-list" id="causeList"></div>
      </aside>
      <section class="allegation-detail" id="causeDetail">
        <p class="empty">Select or add a cause on the left to see its goals.</p>
      </section>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='share-key.js') }}"></script>
<script src="{{ url_for('static', filename='readonly-lock.js') }}"></script>
<script src="{{ url_for('static', filename='causes.js') }}"></script>
</body>
</html>
