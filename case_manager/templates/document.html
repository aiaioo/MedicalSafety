<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document{% if doc_id %} — {{ doc_id }}{% endif %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="docApp"
     data-doc="{{ doc_id }}"
     data-type="{{ doc_type }}"
     {% if doc_id %}
     data-report-url="{{ url_for('api_report', doc_id=doc_id) }}?type={{ doc_type }}"
     data-export-url="{{ url_for('api_report_export', doc_id=doc_id) }}?type={{ doc_type }}"
     data-snippets-url="{{ url_for('api_list_snippets', doc_id=doc_id) }}?type={{ doc_type }}"
     {% endif %}
>
  <header class="topbar">
    <div class="doc-title">
      <a href="{{ url_for('index') }}" title="All documents">&larr;</a>
      Document editor{% if doc_id %} <span class="tag">source: {{ doc_id }}</span>{% endif %}
    </div>
    <div class="pagenav">
      {% if docs %}
      <label class="jump">Source
        <select id="sourceSelect">
          {% for d in docs %}
          <option value="{{ d.id }}|{{ d.type }}" {% if d.id == doc_id and d.type == doc_type %}selected{% endif %}>{{ d.id }} ({{ d.type }})</option>
          {% endfor %}
        </select>
      </label>
      {% if doc_id %}
      <a class="btn" href="{{ url_for('page_view') }}?doc={{ doc_id }}&type={{ doc_type }}&page=1">Annotate source &raquo;</a>
      {% endif %}
      {% endif %}
    </div>
  </header>

  {% if not doc_id %}
  <div class="container">
    <p>No documents found. Drop PDF or Word files into the <code>documents/</code> folder and reload.</p>
  </div>
  {% else %}
  <div class="toolbar">
    <input id="titleInput" type="text" placeholder="Document title" class="title-input">
    <div class="mode-group" role="group" aria-label="Formatting">
      <button type="button" class="fmt-btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button type="button" class="fmt-btn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button type="button" class="fmt-btn" data-cmd="underline" title="Underline"><u>U</u></button>
      <button type="button" class="fmt-btn" data-cmd="formatBlock" data-arg="H2" title="Heading">H2</button>
      <button type="button" class="fmt-btn" data-cmd="formatBlock" data-arg="P" title="Paragraph">P</button>
      <button type="button" class="fmt-btn" data-cmd="insertUnorderedList" title="Bullet list">&bull; List</button>
      <button type="button" class="fmt-btn" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
    </div>
    <button type="button" id="saveReportBtn">Save</button>
    <button type="button" id="exportBtn">Export to PDF</button>
    <span id="reportStatus" class="status-msg"></span>
  </div>

  <main class="viewer-layout">
    <div class="editor-container">
      <div id="editor" class="editor" contenteditable="true"
           data-placeholder="Start writing your document. Click a snippet on the right to insert it here."></div>
    </div>
    <aside class="sidebar">
      <h3>Snippets &amp; annotations</h3>
      <div id="reportSnippetList" class="snippet-list"></div>
    </aside>
  </main>
  {% endif %}
</div>
<script src="{{ url_for('static', filename='document.js') }}"></script>
</body>
</html>
