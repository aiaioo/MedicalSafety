<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annexure</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="app" class="{{ '' if can_edit else 'annex-readonly' }}" data-annexure-url="{{ annexure_url }}" data-can-edit="{{ '1' if can_edit else '' }}">
  <header class="docbar">
    <a class="home-link docbar-lead" href="{{ url_for('index') }}" title="Home"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5 8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/><path d="M6.5 14v-4h3v4"/></svg></a>
    <a class="btn docbar-lead" href="{{ url_for('documents_view') }}?report={{ report_id }}">&laquo; Report</a>
    <div class="docbar-center"><span class="docbar-title">Annexure</span><span class="cause-picker cause-static" title="{{ report_name }}">{{ report_name }}</span></div>
    <a class="btn" style="margin-left: auto;" id="downloadBtn" href="{{ url_for('api_report_annexure_export', report_id=report_id) }}">Download annexure as PDF</a>
    <span id="statusMsg" class="status-msg" style="margin-left: 12px;"></span>
  </header>

  <main class="viewer-layout">
    <div class="viewer-container continuous" id="viewerContainer"></div>
    <aside class="sidebar">
      <div class="source-picker">
        <label class="jump">Add document
          <select id="addSelect"></select>
        </label>
        <button type="button" class="btn" id="addBtn" style="display: table; margin-top: 6px;">Add</button>
      </div>
      <h3>Annexed documents</h3>
      <p class="empty" style="margin-top: 0">Drag to reorder.</p>
      <div id="annexList" class="annex-list"></div>
      <label class="annex-toggle"><input type="checkbox" id="includeAnnotations"> Include annotations</label>
      <h3 class="annex-section-divider">Page numbers</h3>
      <div class="annex-numbering">
        <label class="modal-field">Page number position
          <select id="pageNumberPositionInput">
            <option value="none">None</option>
            <option value="top-center">Top center</option>
            <option value="top-left">Top left</option>
            <option value="top-right">Top right</option>
            <option value="bottom-center">Bottom center</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-right">Bottom right</option>
          </select>
        </label>
        <label class="modal-field">Start numbering at page
          <input id="pageNumberStartInput" type="number" min="1" max="51" step="1">
        </label>
        <label class="modal-field">Page number font
          <select id="pageNumberFontInput">
            <option value="Arial" style="font-family:Arial">Arial</option>
            <option value="Georgia" style="font-family:Georgia">Georgia</option>
            <option value="'Times New Roman'" style="font-family:'Times New Roman'">Times New Roman</option>
            <option value="'Courier New'" style="font-family:'Courier New'">Courier New</option>
            <option value="Verdana" style="font-family:Verdana">Verdana</option>
            <option value="'Trebuchet MS'" style="font-family:'Trebuchet MS'">Trebuchet MS</option>
            <option value="'Comic Sans MS'" style="font-family:'Comic Sans MS'">Comic Sans MS</option>
            <option value="'Bookman Old Style'" style="font-family:'Bookman Old Style'">Bookman Old Style</option>
            <option value="Calibri" style="font-family:Calibri">Calibri</option>
          </select>
        </label>
        <label class="modal-field">Page number font size
          <input id="pageNumberFontSizeInput" type="number" min="6" max="72" step="1">
        </label>
        <label class="modal-field">Shape around page number
          <select id="pageNumberShapeInput">
            <option value="none">None</option>
            <option value="circle">Circle</option>
            <option value="rectangle">Rectangle</option>
          </select>
        </label>
        <div class="modal-field">Page number colour
          <div class="color-pop-wrap">
            <button type="button" class="color-pick-btn" id="pageNumberColorBtn" aria-haspopup="true" aria-expanded="false">Color <span class="color-current" id="pageNumberColorCurrent"></span></button>
            <div id="pageNumberColorPopover" class="color-popover" hidden>
              <div id="pageNumberColorPalette" class="color-palette" role="radiogroup" aria-label="Page number colour"></div>
            </div>
          </div>
        </div>
        <p class="empty" style="margin: 0">Pages before the start page are left unnumbered; numbering then restarts at 1 there. Counts pages of the whole annexure.</p>
      </div>
    </aside>
  </main>
</div>
<script src="{{ url_for('static', filename='sidebar-swipe.js') }}"></script>
<script src="{{ url_for('static', filename='page-number-palette.js') }}"></script>
<script src="{{ url_for('static', filename='annexures.js') }}"></script>
</body>
</html>
