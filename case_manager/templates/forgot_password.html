<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — {{ site_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <form class="modal auth-card" method="post" action="{{ url_for('auth.forgot_password') }}">
    <p class="auth-site-name">{{ site_name }}</p>
    <h3>Forgot your password?</h3>
    <p class="modal-hint">Enter your email address and we'll send you a link to choose a new one.</p>
    <label class="modal-field">Email
      <input type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
    </label>
    <label class="modal-field">Type the characters you see
      <img class="auth-captcha" src="{{ captcha.image }}" alt="Captcha: distorted letters and digits" width="200" height="70">
      <input type="hidden" name="captcha_id" value="{{ captcha.id }}">
      <input type="text" name="captcha_answer" autocomplete="off" autocapitalize="characters"
             spellcheck="false" maxlength="10" required>
    </label>
    {% if error %}<p class="error-message">{{ error }}</p>{% endif %}
    <div class="modal-actions">
      <button type="submit" class="btn">Send reset link</button>
    </div>
    <p class="modal-hint auth-switch"><a href="{{ url_for('auth.signin') }}">Back to sign in</a></p>
    {% include "_also_called.html" %}
  </form>
</div>
</body>
</html>
