<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cases</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="casesApp"
     data-cases-url="{{ url_for('api_allegation_cases') }}"
     data-case-url-base="{{ url_for('api_allegation_case', case_id='__ID__') }}"
     data-allegations-url-base="{{ url_for('allegations_view') }}"
>
  <header class="docbar" style="position: relative;">
    <a class="home-link" href="{{ url_for('index') }}" title="Home"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5 8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/><path d="M6.5 14v-4h3v4"/></svg></a>
    <span class="doc-name doc-name-static" style="position: absolute; left: 50%; transform: translateX(-50%);">Cases</span>
    <span id="saveStatus" class="save-status"></span>
    <a class="btn" style="margin-left: auto;" href="{{ url_for('allegations_view') }}">Allegations</a>
  </header>

  <main class="allegations-layout">
    <div class="allegations-workspace" id="casesWorkspace">
      <aside class="allegations-column cases-column">
        <div class="allegations-column-head">
          <h2>Cases</h2>
          <button type="button" class="btn" id="addCaseBtn">+ New case</button>
        </div>
        <p class="empty" id="caseListEmpty" style="display:none">No cases yet. Add one to get started.</p>
        <div class="allegation-list" id="caseList"></div>
      </aside>
      <section class="allegation-detail" id="caseDetail">
        <p class="empty">Select or add a case on the left to see its hearings.</p>
      </section>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='cases.js') }}"></script>
</body>
</html>
