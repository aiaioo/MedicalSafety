<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allegations</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body{% if g.user and g.user.is_guest %} data-guest="1"{% endif %}>
<div id="allegationsApp"
     data-can-create="{{ '1' if can_create else '' }}"
     data-allegations-url="{{ url_for('api_allegations') }}"
     data-allegation-url-base="{{ url_for('api_allegation_item', allegation_id='__ID__') }}"
     data-allegations-order-url="{{ url_for('api_allegations_order') }}"
     data-cases-url="{{ url_for('api_allegation_cases') }}"
     data-cases-page-url="{{ url_for('cases_view') }}"
     data-causes-url="{{ url_for('api_causes') }}"
     data-reports-url="{{ url_for('api_reports') }}"
     data-documents-page-url="{{ url_for('documents_view') }}"
     data-filter-case="{{ filter_case_id }}"
     data-focus-allegation="{{ focus_allegation_id }}"
>
  <header class="docbar" style="position: relative;">
    <a class="home-link docbar-lead" href="{{ url_for('index') }}" title="Home"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5 8 2l6 5.5"/><path d="M3.5 6.5V14h9V6.5"/><path d="M6.5 14v-4h3v4"/></svg></a>
    <a class="btn docbar-lead" href="{{ url_for('cases_view') }}">Cases</a>
    <div class="docbar-center"><span class="doc-name doc-name-static">Allegations</span>{% include "_cause_picker.html" %}</div>
    <span id="saveStatus" class="save-status"></span>
    <a class="btn" style="margin-left: auto;" href="{{ url_for('documents_view') }}">Reports</a>
  </header>

  <main class="allegations-layout">
    <div class="allegations-workspace" id="allegationsWorkspace">
      <aside class="allegations-column">
        <div class="allegations-column-head">
          <h2>Allegations</h2>
          <button type="button" class="btn" id="addAllegationBtn" {{ 'disabled' if not can_create }}>+ Add allegation</button>
        </div>
        <p class="allegations-filter-bar" id="filterBar" style="display:none"></p>
        <p class="empty" id="allegationListEmpty" style="display:none">No allegations yet. Add one to get started.</p>
        <div class="allegation-list" id="allegationList"></div>
      </aside>
      <section class="allegation-detail" id="allegationDetail">
        <p class="empty">Select or add an allegation on the left to see its evidence.</p>
      </section>
    </div>
  </main>
</div>
<script src="{{ url_for('static', filename='share-key.js') }}"></script>
<script src="{{ url_for('static', filename='readonly-lock.js') }}"></script>
<script src="{{ url_for('static', filename='allegations.js') }}"></script>
</body>
</html>
