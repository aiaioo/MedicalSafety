<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if case_id %}Allegations editor{% else %}Allegations{% endif %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="allegationsApp"
     data-case="{{ case_id }}"
     data-cases-url="{{ url_for('api_allegation_cases') }}"
     {% if case_id %}
     data-case-url="{{ url_for('api_allegation_case', case_id=case_id) }}"
     {% endif %}
>
  <header class="docbar">
    <a class="home-link" href="{{ url_for('index') }}" title="All documents">&larr;</a>

    <nav class="file-menu">
      <button type="button" class="menu-trigger" id="fileMenuBtn">File</button>
      <div class="menu-dropdown" id="fileMenuDropdown">
        <button type="button" id="newCaseBtn">New case&hellip;</button>
        <button type="button" id="openCaseBtn">Open&hellip;</button>
      </div>
    </nav>

    {% if case_id %}
    <input id="titleInput" class="doc-name" type="text" placeholder="Untitled case">
    <button type="button" id="saveBtn" class="save-btn">Save</button>
    {% endif %}
    <span id="saveStatus" class="save-status"></span>
  </header>

  <main class="allegations-layout">
    {% if case_id %}
    <div class="allegations-workspace" id="allegationsWorkspace">
      <aside class="allegations-column">
        <div class="allegations-column-head">
          <h2>Allegations</h2>
          <button type="button" class="btn" id="addAllegationBtn">+ Add allegation</button>
        </div>
        <p class="empty" id="allegationListEmpty" style="display:none">No allegations yet. Add one to get started.</p>
        <div class="allegation-list" id="allegationList"></div>
      </aside>
      <section class="allegation-detail" id="allegationDetail">
        <p class="empty">Select or add an allegation on the left to see its evidence.</p>
      </section>
    </div>
    {% else %}
    <div class="doc-landing">
      <h2>Allegation cases</h2>
      <p class="empty" id="landingEmptyHint">No cases yet. Use File &rarr; New case to create one.</p>
      <div id="caseListLanding" class="report-grid"></div>
    </div>
    {% endif %}
  </main>

  <div class="modal-overlay" id="newCaseModal">
    <div class="modal">
      <h3>New case</h3>
      <label class="modal-field">Name
        <input id="newCaseName" type="text" placeholder="e.g. State v. Smith" maxlength="200">
      </label>
      <p id="newCaseError" class="error-message" style="display:none"></p>
      <div class="modal-actions">
        <button type="button" id="newCaseCancel">Cancel</button>
        <button type="button" id="newCaseCreate">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="openCaseModal">
    <div class="modal">
      <h3>Open a case</h3>
      <div id="openCaseList" class="report-list"></div>
      <div class="modal-actions">
        <button type="button" id="openCaseCancel">Close</button>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='allegations.js') }}"></script>
</body>
</html>
