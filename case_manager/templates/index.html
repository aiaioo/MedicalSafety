<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h1>Documents</h1>
  {% if docs %}
  <p><a href="{{ url_for('document_view') }}">Open the document editor &raquo;</a></p>
  {% endif %}
  {% if docs %}
  <ul class="doc-list">
    {% for d in docs %}
    <li>
      <a href="{{ url_for('page_view') }}?doc={{ d.id }}&type={{ d.type }}&page=1">
        {{ d.id }} <span class="tag">{{ d.type }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No documents found. Drop PDF or Word files into the <code>documents/</code> folder and reload.</p>
  {% endif %}
</div>
</body>
</html>
